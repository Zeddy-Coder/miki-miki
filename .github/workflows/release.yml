name: Release

# Реліз збирається, коли пушиться тег виду v1.2.3 (наприклад: git tag v1.2.3 && git push --tags)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Перевірка версії
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:\s*([0-9.]+).*/\1/')"
          if [ "$tag" != "$ver" ]; then
            echo "Тег v$tag не збігається з версією в pubspec.yaml ($ver)"; exit 1
          fi

      - name: Ключ підпису
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/miki-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/miki-release.jks" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Збірка APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Назва файлу
        run: |
          name="miki_miki-${GITHUB_REF_NAME:-dev}-arm64.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$name"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - name: Реліз на GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: true
