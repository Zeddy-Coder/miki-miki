<script>
(function () {
	"use strict";

	var promo = document.getElementById("ma-promo");
	if (!promo) return;

	var DISMISS_DAYS = 14;
	var STORE_KEY = "ma:pref:promo_tg_hidden_until";
	var GAP = 16;
	var FALLBACK_BOTTOM = 90;
	var FALLBACK_BOTTOM_MOBILE = 70;
	
	
	var OWN_HOSTS = ["moonanime.vip", "moonanime.art", "moonanime.net"];

	function remove() {
		if (promo.parentNode) promo.parentNode.removeChild(promo);
	}

	
	
	
	
	function readHiddenUntil() {
		try {
			return parseInt(window.localStorage.getItem(STORE_KEY), 10) || 0;
		} catch (e) {
			return 0;
		}
	}
	function writeHiddenUntil(ts) {
		try {
			window.localStorage.setItem(STORE_KEY, String(ts));
		} catch (e) {
			
		}
	}

	
	function parentHost() {
		if (window.self === window.top) return window.location.hostname;
		try {
			return window.top.location.hostname;
		} catch (e) {
			
			if (!document.referrer) return "";
			try {
				return new URL(document.referrer).hostname;
			} catch (e2) {
				return "";
			}
		}
	}

	var host = (parentHost() || "").replace(/^www\./i, "").toLowerCase();
	for (var i = 0; i < OWN_HOSTS.length; i++) {
		if (host === OWN_HOSTS[i] || host.slice(-(OWN_HOSTS[i].length + 1)) === "." + OWN_HOSTS[i]) {
			remove();
			return;
		}
	}
	if (Date.now() < readHiddenUntil()) {
		remove();
		return;
	}

	
	
	
	
	var MOUNTS = [
		{ sel: "#ma-player-wrap", slot: null },   
		{ sel: ".ma-wrap", slot: null },          
		{ sel: "#mp-root", slot: "middle-chrome" },
		{ sel: "#ma-plain-wrap", slot: null },    
		{ sel: "div.video-js.vjs-ma", slot: null } 
	];

	var mount = null;
	for (var m = 0; m < MOUNTS.length; m++) {
		var node = document.querySelector(MOUNTS[m].sel);
		if (node) {
			mount = MOUNTS[m];
			mount.node = node;
			break;
		}
	}

	if (mount) {
		
		
		
		
		if (mount.slot) promo.setAttribute("slot", mount.slot);
		mount.node.appendChild(promo);
	} else {
		document.body.appendChild(promo);
		promo.classList.add("ma-promo--floating");
	}

	
	
	
	
	
	var BARS = [".plyr__controls", "media-control-bar", "media-controls", ".vds-controls", ".vjs-control-bar"];

	function measure() {
		var barRect = null;
		for (var b = 0; b < BARS.length; b++) {
			var bar = document.querySelector(BARS[b]);
			if (bar) {
				var rect = bar.getBoundingClientRect();
				if (rect.height > 0) {
					barRect = rect;
					break;
				}
			}
		}

		var bottom;
		if (barRect) {
			
			
			
			
			
			
			var hostBottom = promo.classList.contains("ma-promo--floating")
				? window.innerHeight
				: (promo.offsetParent || document.documentElement).getBoundingClientRect().bottom;
			bottom = hostBottom - barRect.top + GAP;
		}
		
		
		
		if (!(bottom > 0)) {
			bottom = window.innerWidth <= 767 ? FALLBACK_BOTTOM_MOBILE : FALLBACK_BOTTOM;
		}
		promo.style.setProperty("--ma-promo-bottom", Math.round(bottom) + "px");
	}

	
	
	function controlsVisible() {
		var plyr = document.querySelector(".plyr");
		if (plyr) {
			return plyr.classList.contains("plyr--paused") || !plyr.classList.contains("plyr--hide-controls");
		}
		var vjs = document.querySelector("div.video-js.vjs-ma");
		if (vjs) {
			return vjs.classList.contains("vjs-paused") || !vjs.classList.contains("vjs-user-inactive");
		}
		var mc = document.querySelector("media-controller");
		if (mc) {
			return mc.hasAttribute("mediapaused") || !mc.hasAttribute("userinactive");
		}
		var vds = document.querySelector("[data-media-player]");
		if (vds) {
			return vds.hasAttribute("data-paused") || vds.hasAttribute("data-controls");
		}
		return null;
	}

	
	
	
	
	var RIVALS = ".ma-skip-btn--visible, .ma-playlist-next-card--visible, .ma-skip-container:not(.ma-skip-hidden), .ma-studio-promo--visible, .ma-vjs-error.is-visible, .ma-panel-open";

	var playing = false;
	var scheduled = false;

	function update() {
		scheduled = false;
		if (!promo.parentNode) return;
		var cv = controlsVisible();
		
		
		var show = !document.querySelector(RIVALS) && (!playing || cv === true);
		promo.classList.toggle("ma-promo--visible", show);
		if (show) measure();
	}

	function schedule() {
		if (scheduled) return;
		scheduled = true;
		window.requestAnimationFrame(update);
	}

	function setPlaying(next) {
		playing = next;
		schedule();
	}

	window.addEventListener("ma-player-state", function (e) {
		if (!e || !e.detail || typeof e.detail.playing !== "boolean") return;
		setPlaying(e.detail.playing);
	});
	
	
	
	document.addEventListener("play", function (e) {
		if (e.target && e.target.tagName === "VIDEO") setPlaying(true);
	}, true);
	document.addEventListener("pause", function (e) {
		if (e.target && e.target.tagName === "VIDEO") setPlaying(false);
	}, true);
	document.addEventListener("ended", function (e) {
		if (e.target && e.target.tagName === "VIDEO") setPlaying(false);
	}, true);

	var observerTarget = (mount && mount.node) || document.body;
	new MutationObserver(schedule).observe(observerTarget, {
		attributes: true,
		attributeFilter: ["class", "userinactive", "mediapaused", "data-controls", "data-paused"],
		subtree: true,
